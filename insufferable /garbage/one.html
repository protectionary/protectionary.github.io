<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>extra images number one</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap');

body {
  background:black;
  color:white;
  font-family:'JetBrains Mono', monospace;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header {text-align:center;padding:2rem 1rem;border-bottom:2px solid white;}
header h2 {margin:0;font-size:2rem;letter-spacing:2px;text-transform:lowercase;}

.container {flex:1;max-width:1000px;margin:2rem auto;padding:0 1rem;}
.post {margin-bottom:3rem;border-bottom:1px solid white;padding-bottom:2rem;}
.post h2 {font-size:1.8rem;text-transform:lowercase;margin-bottom:0.5rem;letter-spacing:1px;}
.post p {color:#ccc;line-height:1.6;}

.photo-grid {display:grid;grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));gap:10px;margin-top:1rem;}
.photo-grid div {display:flex;justify-content:center;}
.photo-grid img {width:100%;height:auto;border:2px solid white;border-radius:4px;transition: transform 0.2s, filter 0.2s;filter:grayscale(100%);cursor:pointer;}
.photo-grid img:hover {transform:scale(1.05);filter:grayscale(0%);}

footer {text-align:center;padding:2rem 1rem;border-top:2px solid white;color:#888;font-size:0.9rem;}
.caption {text-align:center;margin-top:0.5rem;color:white;font-size:0.85rem;text-shadow:0 0 5px white;}

#spotlight {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:999;
}

#spotlight img {
  max-width:90%;
  max-height:90%;
  border:2px solid white;
  border-radius:4px;
}

#spotlight button {
  position:absolute;
  top:20px; right:20px;
  background:none;
  border:2px solid white;
  color:white;
  font-size:1.5rem;
  padding:0.5rem 1rem;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
<h2>images to get you started</h2>
</header>

<footer>
protectionary did NOT make ts
</footer>

<div id="spotlight">
<button onclick="what()">X</button>
<img src="" alt="what">
</div>

<script>
const sl = document.getElementById('spotlight');
const slIMG = spotlight.querySelector('img');

document.querySelectorAll('.photo-grid img').forEach(img => {
  img.addEventListener('click', () => {
    sl.style.display = 'flex';
    slIMG.src = img.src;
  });
});

function what() {
  sl.style.display = 'none';
  slIMG.src = '';
}
</script>
