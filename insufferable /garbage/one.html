body {
  background:black;
  color:white;
  font-family:'JetBrains Mono', monospace;
  margin:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header {
  text-align:center;
  padding:2rem 1rem;
  border-bottom:2px solid white;
}

header h2 {
  margin:0;
  font-size:2rem;
  letter-spacing:2px;
  text-transform:lowercase;
}

header h5 {
  margin:0.4rem 0 0;
  font-weight:normal;
  color:#888;
  cursor:pointer;
}

.container {
  flex:1;
  max-width:1000px;
  margin:2rem auto;
  padding:0 1rem;
}

.post {
  margin-bottom:3rem;
  border-bottom:1px solid white;
  padding-bottom:2rem;
}

.photo-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:10px;
  margin-top:1rem;
}

.photo-grid img {
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border:2px solid white;
  filter:grayscale(100%);
  cursor:pointer;
}

.photo-grid img:hover { filter:grayscale(0%); }

footer {
  text-align:center;
  padding:2rem 1rem;
  border-top:2px solid white;
  color:#888;
  font-size:0.9rem;
}

/* overlays */

.overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  z-index:999;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.overlay button {
  position:absolute;
  top:20px;
  right:20px;
  background:none;
  border:2px solid white;
  color:white;
  font-size:1.2rem;
  padding:0.3rem 0.6rem;
  cursor:pointer;
}

/* spotlight */

#spotlight img {
  max-width:90%;
  max-height:80%;
  border:2px solid white;
}

#spotlight .desc {
  margin-top:10px;
  color:#ccc;
  border-top:1px solid white;
  padding-top:8px;
  max-width:80%;
  text-align:center;
}

#spotlight .counter {
  position:absolute;
  bottom:20px;
  color:#888;
  font-size:0.85rem;
}

/* changelog */

#changelogBox {
  max-width:600px;
  border:2px solid white;
  padding:1.5rem;
  background:black;
}

#changelogBox h3 {
  margin-top:0;
  text-transform:lowercase;
  cursor:pointer;
}

.md p { color:#ccc; margin:0.4rem 0; }
.md ul { padding-left:1.2rem; color:#ccc; }
.md li { margin-bottom:0.3rem; }
.md strong { display:block; margin-top:0.8rem; }

.dev {

  margin-top:1rem;
  padding-top:0.8rem;
  border-top:1px dashed white;

<script>
/* spotlight */
const sl = document.getElementById('spotlight');
const slIMG = sl.querySelector('img');
const slDESC = sl.querySelector('.desc');
const slCOUNT = sl.querySelector('.counter');
const imgs = [...document.querySelectorAll('.photo-grid img')];
let index = 0;

imgs.forEach((img,i)=>img.onclick=()=>{index=i;sl.style.display='flex';updateSL();});

function updateSL(){
  slIMG.src=imgs[index].src;
  slDESC.textContent=imgs[index].dataset.desc||'';
  slCOUNT.textContent=(index+1)+' / '+imgs.length;
}
function closeSL(){ sl.style.display='none'; }

document.addEventListener('keydown',e=>{
  if(sl.style.display==='flex'){
    if(e.key==='Escape') closeSL();
    if(e.key==='ArrowRight'){index=(index+1)%imgs.length;updateSL();}
    if(e.key==='ArrowLeft'){index=(index-1+imgs.length)%imgs.length;updateSL();}
  }
  if(e.key==='Escape') closeLog();
});
sl.onclick=e=>{if(e.target===sl)closeSL();};

/* markdown (fixed lists) */
function md(t){
  let h=t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/(?:^|\n)- (.*)/g,'<li>$1</li>');
  h=h.replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>');
  h=h.replace(/\n{2,}/g,'</p><p>');
  return '<p>'+h+'</p>'.replace(/<p><ul>/g,'<ul>').replace(/<\/ul><\/p>/g,'</ul>');
}

/* changelog */
const log=document.getElementById('log');
const logContent=document.getElementById('logContent');
const devNotes=document.getElementById('devNotes');
let clicks=0;

const changelogMD=`
**v1.2**
- optimizations (alot)
- changelog

**v1.1**
- spotlight
- arrow navigation
- esc to close

**v1.0**
- bare bones site (thank god it wasn't published)
`;

const devMD=`
**dev notes**
- cloudflare is a mistake
- have fun gooning
- no regrets
`;

function openLog(){
  log.style.display='flex';
  logContent.innerHTML=md(changelogMD);
}
function closeLog(){ log.style.display='none'; }

document.getElementById('logTitle').onclick=()=>{
  if(++clicks>=5){
    devNotes.style.display='block';
    devNotes.innerHTML=md(devMD);
  }
};
log.onclick=e=>{if(e.target===log)closeLog();};
</script>
