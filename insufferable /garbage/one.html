<script>
const sl = document.getElementById('spotlight');
const slIMG = sl.querySelector('img');
const slDESC = sl.querySelector('.desc');
const slCOUNT = sl.querySelector('.counter');

const imgs = Array.from(document.querySelectorAll('.photo-grid img'));
let index = 0;

function openSL(i) {
  index = i;
  sl.style.display = 'flex';
  updateSL();
}

function updateSL() {
  slIMG.src = imgs[index].src;
  slDESC.textContent = imgs[index].dataset.desc || '';
  slCOUNT.textContent = (index + 1) + ' / ' + imgs.length;
}

imgs.forEach((img, i) => {
  img.addEventListener('click', () => openSL(i));
});

function closeSL() {
  sl.style.display = 'none';
  slIMG.src = '';
  slDESC.textContent = '';
}

document.addEventListener('keydown', e => {
  if (sl.style.display !== 'flex') return;

  if (e.key === 'Escape') closeSL();

  if (e.key === 'ArrowRight') {
    index = (index + 1) % imgs.length;
    updateSL();
  }

  if (e.key === 'ArrowLeft') {
    index = (index - 1 + imgs.length) % imgs.length;
    updateSL();
  }
});

sl.addEventListener('click', e => {
  if (e.target === sl) closeSL();
});
</script>
