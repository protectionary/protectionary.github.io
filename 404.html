<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what are you doing here</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .triggered-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            border: 5px solid #a71313;
            overflow: hidden;
            animation: shake 0.1s infinite;
        }

        .triggered-img {
            width: 100%;
            height: 310px;
            object-fit: contain;
            background: #000;
            filter: grayscale(1) contrast(200%);
            padding: 10px;
        }

        .triggered-bar {
            background: #a71313;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-style: italic;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .error-text {
            margin-top: 2rem;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-top: 1rem;
            color: #fff;
            text-decoration: underline;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="triggered-container">
            <img src="yeezytroll.png" class="triggered-img" alt="404">
            <div class="triggered-bar">NO!</div>
        </div>
        
        <div class="error-text">
            <h1>₄₀₄</h1>
            <p>this page is beamed.</p>
            <a href="index.html" class="back-link">back to reality</a>
        </div>
    </div>
</body>
</html>
